<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gabs Games</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.10), transparent 42%),
        #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    main {
      width: min(900px, 100%);
    }

    .topo {
      text-align: center;
      margin-bottom: 34px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 64px);
      letter-spacing: -2px;
    }

    .sub {
      margin: 10px 0 0;
      color: rgba(255,255,255,.58);
      font-size: 15px;
    }

    .games {
      display: grid;
      gap: 8px;
      max-width: 480px;
      margin: 0 auto;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 58px;
      padding: 12px 16px;
      border: 1px solid #353535;
      border-radius: 8px;
      background: #111;
      color: #fff;
      text-decoration: none;
    }

    .card:hover {
      border-color: #666;
      background: #1c1c1c;
    }

    .card:focus-visible {
      outline: 2px solid #ddd;
      outline-offset: 2px;
    }

    .card h2 {
      margin: 0;
      font-size: 18px;
    }

    .seta {
      color: #aaa;
      flex: none;
    }

    .voltar {
      display: table;
      margin: 26px auto 0;
      color: rgba(255,255,255,.55);
      text-decoration: none;
      font-size: 14px;
    }

    .voltar:hover {
      color: #fff;
    }

  </style>
</head>
<body>
  <main>
    <div class="topo">
      <h1>Gabs Games</h1>
      <p class="sub">Escolha um jogo</p>
    </div>

    <div class="games">
      <a class="card" href="/clicker/">
        <h2>Gabs Clicker</h2>
        <span class="seta" aria-hidden="true">→</span>
      </a>

      <a class="card" href="/3D/">
        <h2>Gabs 3D</h2>
        <span class="seta" aria-hidden="true">→</span>
      </a>

      <a class="card" href="/gabshorror3d/">
        <h2>Gabs Horror 3D</h2>
        <span class="seta" aria-hidden="true">→</span>
      </a>
    </div>

    <a class="voltar" href="/">← Voltar</a>
  </main>
</body>
</html>
