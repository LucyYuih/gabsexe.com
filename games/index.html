<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gabs Games</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.10), transparent 42%),
        #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    main {
      width: min(900px, 100%);
    }

    .topo {
      text-align: center;
      margin-bottom: 34px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 64px);
      letter-spacing: -2px;
    }

    .sub {
      margin: 10px 0 0;
      color: rgba(255,255,255,.58);
      font-size: 15px;
    }

    .games {
      display: grid;
      gap: 8px;
      max-width: 480px;
      margin: 0 auto;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 58px;
      padding: 12px 16px;
      border: 1px solid #353535;
      border-radius: 8px;
      background: #111;
      color: #fff;
      text-decoration: none;
    }

    .card:hover {
      border-color: #666;
      background: #1c1c1c;
    }

    .card:focus-visible {
      outline: 2px solid #ddd;
      outline-offset: 2px;
    }

    .card h2,
    .card-title {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
    }

    .seta {
      color: #aaa;
      flex: none;
    }

    .voltar {
      display: table;
      margin: 26px auto 0;
      color: rgba(255,255,255,.55);
      text-decoration: none;
      font-size: 14px;
    }

    .voltar:hover {
      color: #fff;
    }

    button.card {
      width: 100%;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .game-dialog {
      width: min(680px, calc(100% - 32px));
      max-height: calc(100% - 32px);
      padding: 24px;
      border: 1px solid #353535;
      border-radius: 12px;
      background: #0d0d0d;
      color: #fff;
    }

    .game-dialog::backdrop {
      background: rgba(0, 0, 0, .76);
    }

    body:has(.game-dialog[open]) {
      overflow: hidden;
    }

    .game-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .game-dialog-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .game-dialog-close {
      display: grid;
      place-items: center;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border: 1px solid #353535;
      border-radius: 8px;
      background: #111;
      color: inherit;
      font: inherit;
      font-size: 24px;
      cursor: pointer;
    }

    .game-dialog-close:hover {
      border-color: #666;
      background: #1c1c1c;
    }

    .game-dialog-close:focus-visible {
      outline: 2px solid #ddd;
      outline-offset: 2px;
    }

    .game-dialog-columns {
      display: grid;
      grid-template-columns: 2fr 3fr;
      gap: 24px;
    }

    .game-dialog-columns h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .game-dialog-links {
      display: grid;
      gap: 8px;
    }

    @media (max-width: 540px) {
      .game-dialog {
        padding: 16px;
      }

      .game-dialog-columns {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

  </style>
</head>
<body>
  <main>
    <div class="topo">
      <h1>Gabs Games</h1>
      <p class="sub">Escolha um jogo</p>
    </div>

    <div class="games">
      <a class="card" href="/clicker/">
        <h2>Gabs Clicker</h2>
        <span class="seta" aria-hidden="true">→</span>
      </a>

      <a class="card" href="/3D/">
        <h2>Gabs 3D</h2>
        <span class="seta" aria-hidden="true">→</span>
      </a>

      <button class="card" id="horror-card" type="button" aria-haspopup="dialog" aria-controls="horror-dialog">
        <span class="card-title">Gabs Horror 3D</span>
        <span class="seta" aria-hidden="true">→</span>
      </button>
    </div>

    <a class="voltar" href="/">← Voltar</a>
  </main>

  <dialog class="game-dialog" id="horror-dialog" aria-labelledby="horror-dialog-title">
    <header class="game-dialog-header">
      <h2 id="horror-dialog-title">Gabs Horror 3D</h2>
      <form method="dialog">
        <button class="game-dialog-close" type="submit" aria-label="Fechar" autofocus>×</button>
      </form>
    </header>

    <div class="game-dialog-columns">
      <section aria-labelledby="horror-web-title">
        <h3 id="horror-web-title">WEB</h3>
        <a class="card" href="/gabshorror3d/">
          <span class="card-title">Jogar na web</span>
          <span class="seta" aria-hidden="true">→</span>
        </a>
      </section>

      <section aria-labelledby="horror-downloads-title">
        <h3 id="horror-downloads-title">Downloads</h3>
        <div class="game-dialog-links">
          <a class="card" href="https://github.com/LucyYuih/gabsexe.com/releases/download/gabshorror3d/Gabs-Horror-3D-1.3.5-Windows-x64-Tauri.zip">
            <span class="card-title">Windows x64 (leve)</span>
            <span class="seta" aria-hidden="true">↓</span>
          </a>
          <a class="card" href="https://github.com/LucyYuih/gabsexe.com/releases/download/gabshorror3d/Gabs-Horror-3D-1.3.5-Windows-x64-Electron.zip">
            <span class="card-title">Windows x64 (compatibilidade)</span>
            <span class="seta" aria-hidden="true">↓</span>
          </a>
          <a class="card" href="https://github.com/LucyYuih/gabsexe.com/releases/download/gabshorror3d/Gabs-Horror-3D-1.3.5-Linux-x64.AppImage">
            <span class="card-title">Linux (AppImage)</span>
            <span class="seta" aria-hidden="true">↓</span>
          </a>
          <a class="card" href="https://github.com/LucyYuih/gabsexe.com/releases/download/gabshorror3d/Gabs-Horror-3D-1.3.5-macOS-Intel-x64.zip">
            <span class="card-title">macOS (Intel x64)</span>
            <span class="seta" aria-hidden="true">↓</span>
          </a>
          <a class="card" href="https://github.com/LucyYuih/gabsexe.com/releases/download/gabshorror3d/Gabs-Horror-3D-1.3.5-Android.apk">
            <span class="card-title">Android (APK)</span>
            <span class="seta" aria-hidden="true">↓</span>
          </a>
        </div>
      </section>
    </div>
  </dialog>

  <script>
    const horrorCard = document.getElementById("horror-card");
    const horrorDialog = document.getElementById("horror-dialog");

    horrorCard.addEventListener("click", () => horrorDialog.showModal());

    horrorDialog.addEventListener("click", (event) => {
      if (event.target !== horrorDialog) return;

      const { left, right, top, bottom } = horrorDialog.getBoundingClientRect();
      if (event.clientX < left || event.clientX > right ||
          event.clientY < top || event.clientY > bottom) {
        horrorDialog.close();
      }
    });
  </script>
</body>
</html>
