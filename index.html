<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #imagem {
      display: block;
      width: min(100vw, 100vh);
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 9999;
      pointer-events: auto;
    }

    #overlay.ativo {
      display: flex;
    }

    #jumpscareVideo {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      background: #000;
      pointer-events: none;
    }

    #gameButton {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #gameButton:hover {
      transform: scale(1.08);
      background: #fff;
    }

    #gameButton:active {
      transform: scale(0.96);
    }

    #gameButton::before {
      content: "";
      width: 0;
      height: 0;
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      border-left: 17px solid #000;
      margin-left: 4px;
    }


    #rickButton {
      position: fixed;
      left: 24px;
      bottom: 24px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #rickButton:hover {
      transform: scale(1.08);
      background: #fff;
    }

    #rickButton:active {
      transform: scale(0.96);
    }

    #rickButton::before {
      content: "";
      width: 0;
      height: 0;
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      border-right: 17px solid #000;
      margin-right: 4px;
    }

  </style>
</head>
<body>
  <a id="gameButton" href="/games/" aria-label="Abrir hub de jogos" title="Games"></a>
  <a id="rickButton" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer" aria-label="Voltar" title="Voltar"></a>
  <img id="imagem" src="./imagem.jpg" alt="" draggable="false">

  <div id="overlay" aria-hidden="true">
    <video id="jumpscareVideo" preload="auto" playsinline muted>
      <source src="./jumpscare.mp4" type="video/mp4">
    </video>
  </div>

  <audio id="audio" src="./audio.mp3" preload="auto"></audio>
  <audio id="jumpscareAudio" src="./jumpscare.mp3" preload="auto"></audio>

  <script>
    (function () {
      "use strict";

      var imagem = document.getElementById("imagem");
      var audio = document.getElementById("audio");
      var overlay = document.getElementById("overlay");
      var jumpscareAudio = document.getElementById("jumpscareAudio");
      var jumpscareVideo = document.getElementById("jumpscareVideo");
      var rickButton = document.getElementById("rickButton");

      var clickCount = 0;
      var jumpscareDone = false;
      var overlayActive = false;

      function playNormalAudio() {
        try {
          audio.pause();
          audio.currentTime = 0;

          var playPromise = audio.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function () {});
          }
        } catch (e) {}
      }

      function endJumpscare() {
        jumpscareVideo.pause();
        overlay.classList.remove("ativo");
        overlay.setAttribute("aria-hidden", "true");
        overlayActive = false;
        imagem.style.pointerEvents = "auto";
      }

      function playJumpscare() {
        if (jumpscareDone || overlayActive) {
          return;
        }

        overlayActive = true;
        jumpscareDone = true;

        audio.pause();
        audio.currentTime = 0;

        overlay.classList.add("ativo");
        overlay.setAttribute("aria-hidden", "false");
        imagem.style.pointerEvents = "none";

        jumpscareVideo.pause();
        jumpscareVideo.currentTime = 0;

        jumpscareAudio.pause();
        jumpscareAudio.currentTime = 0;

        try {
          var videoPromise = jumpscareVideo.play();
          if (videoPromise && typeof videoPromise.catch === "function") {
            videoPromise.catch(function () {});
          }
        } catch (e) {}

        try {
          var scarePromise = jumpscareAudio.play();
          if (scarePromise && typeof scarePromise.catch === "function") {
            scarePromise.catch(function () {});
          }
        } catch (e) {}
      }


      rickButton.addEventListener("click", function () {
        try {
          var texto = "Tomou rick roll em live KKKKKKKKKKKKKKKKKK";
          var blob = new Blob([texto], { type: "text/plain;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var downloadLink = document.createElement("a");

          downloadLink.href = url;
          downloadLink.download = "rickroll.txt";
          downloadLink.style.display = "none";
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);

          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
        } catch (e) {}
      });

      imagem.addEventListener("click", function () {
        if (overlayActive) {
          return;
        }

        clickCount += 1;

        if (!jumpscareDone && clickCount === 3) {
          playJumpscare();
          return;
        }

        playNormalAudio();
      });

      jumpscareAudio.addEventListener("ended", endJumpscare);
      window.addEventListener("load", function () {
        playNormalAudio();
      });
    }());
  </script>
</body>
</html>
