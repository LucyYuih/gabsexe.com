<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #imagem {
      display: block;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      object-position: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      position: relative;
      z-index: 1;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 9999;
      pointer-events: all;
    }

    #overlay.ativo {
      display: flex;
    }

    #overlay video {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      object-position: center;
      pointer-events: none;
      background: #000;
    }
  </style>
</head>
<body>
  <img id="imagem" src="imagem.jpg" alt="" draggable="false" />

  <div id="overlay" aria-hidden="true">
    <video id="jumpscareVideo" preload="auto" playsinline muted>
      <source src="jumpscare.mp4" type="video/mp4" />
    </video>
  </div>

  <audio id="audio" src="audio.mp3" preload="auto" autoplay></audio>
  <audio id="jumpscareAudio" src="jumpscare.mp3" preload="auto"></audio>

  <script>
    const imagem = document.getElementById('imagem');
    const audio = document.getElementById('audio');
    const overlay = document.getElementById('overlay');
    const jumpscareAudio = document.getElementById('jumpscareAudio');
    const jumpscareVideo = document.getElementById('jumpscareVideo');

    let clickCount = 0;
    let jumpscareDone = false;
    let overlayActive = false;

    function tocarAudioInicial() {
      audio.currentTime = 0;
      audio.play().catch(() => {
    }

    function tocarJumpscare() {
      if (jumpscareDone || overlayActive) return;

      overlayActive = true;
      jumpscareDone = true;
      overlay.classList.add('ativo');
      overlay.setAttribute('aria-hidden', 'false');
      imagem.style.pointerEvents = 'none';

      audio.pause();
      audio.currentTime = 0;

      jumpscareVideo.pause();
      jumpscareVideo.currentTime = 0;
      jumpscareAudio.pause();
      jumpscareAudio.currentTime = 0;

      jumpscareVideo.play().catch(() => {});
      jumpscareAudio.play().catch(() => {});
    }

    function encerrarJumpscare() {
      jumpscareVideo.pause();
      overlay.classList.remove('ativo');
      overlay.setAttribute('aria-hidden', 'true');
      overlayActive = false;
      imagem.style.pointerEvents = 'auto';
    }

    window.addEventListener('DOMContentLoaded', () => {
      tocarAudioInicial();
    });

    imagem.addEventListener('click', () => {
      if (overlayActive) return;

      clickCount += 1;

      if (!jumpscareDone && clickCount === 3) {
        tocarJumpscare();
        return;
      }

      tocarAudioInicial();
    });

    jumpscareAudio.addEventListener('ended', encerrarJumpscare);
  </script>
</body>
</html>
