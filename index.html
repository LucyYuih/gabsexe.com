<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #imagem {
      display: block;
      width: min(100vw, 100vh);
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 9999;
      pointer-events: auto;
    }

    #overlay.ativo {
      display: flex;
    }

    #jumpscareVideo {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      background: #000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img id="imagem" src="./imagem.jpg" alt="" draggable="false">

  <div id="overlay" aria-hidden="true">
    <video id="jumpscareVideo" preload="auto" playsinline muted>
      <source src="./jumpscare.mp4" type="video/mp4">
    </video>
  </div>

  <audio id="audio" src="./audio.mp3" preload="auto"></audio>
  <audio id="jumpscareAudio" src="./jumpscare.mp3" preload="auto"></audio>

  <script>
    (function () {
      "use strict";

      var imagem = document.getElementById("imagem");
      var audio = document.getElementById("audio");
      var overlay = document.getElementById("overlay");
      var jumpscareAudio = document.getElementById("jumpscareAudio");
      var jumpscareVideo = document.getElementById("jumpscareVideo");

      var clickCount = 0;
      var jumpscareDone = false;
      var overlayActive = false;

      function playNormalAudio() {
        try {
          audio.pause();
          audio.currentTime = 0;

          var playPromise = audio.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function () {});
          }
        } catch (e) {}
      }

      function endJumpscare() {
        jumpscareVideo.pause();
        overlay.classList.remove("ativo");
        overlay.setAttribute("aria-hidden", "true");
        overlayActive = false;
        imagem.style.pointerEvents = "auto";
      }

      function playJumpscare() {
        if (jumpscareDone || overlayActive) {
          return;
        }

        overlayActive = true;
        jumpscareDone = true;

        audio.pause();
        audio.currentTime = 0;

        overlay.classList.add("ativo");
        overlay.setAttribute("aria-hidden", "false");
        imagem.style.pointerEvents = "none";

        jumpscareVideo.pause();
        jumpscareVideo.currentTime = 0;

        jumpscareAudio.pause();
        jumpscareAudio.currentTime = 0;

        try {
          var videoPromise = jumpscareVideo.play();
          if (videoPromise && typeof videoPromise.catch === "function") {
            videoPromise.catch(function () {});
          }
        } catch (e) {}

        try {
          var scarePromise = jumpscareAudio.play();
          if (scarePromise && typeof scarePromise.catch === "function") {
            scarePromise.catch(function () {});
          }
        } catch (e) {}
      }

      imagem.addEventListener("click", function () {
        if (overlayActive) {
          return;
        }

        clickCount += 1;

        if (!jumpscareDone && clickCount === 3) {
          playJumpscare();
          return;
        }

        playNormalAudio();
      });

      jumpscareAudio.addEventListener("ended", endJumpscare);
      window.addEventListener("load", function () {
        playNormalAudio();
      });
    }());
  </script>
</body>
</html>
